<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>历史会话 — 登录/登出入口 UI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    gap: 40px;
    flex-wrap: wrap;
  }
  .phone {
    width: 375px; height: 700px;
    background: #F5F0EB;
    border-radius: 32px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex; flex-direction: column;
  }
  .label {
    color: #999; text-align: center; font-size: 13px;
    margin-top: 12px; font-weight: 500;
    letter-spacing: 0.5px;
  }
  /* Header */
  .header {
    display: flex; align-items: center; padding: 12px 16px;
    background: #F5F0EB; border-bottom: 0.5px solid rgba(92,74,58,0.1);
  }
  .btn-back {
    width: 40px; height: 40px; display: flex; align-items: center;
    justify-content: center; font-size: 20px; color: #5C4A3A;
    cursor: pointer; border-radius: 50%; transition: background 0.2s;
  }
  .btn-back:hover { background: rgba(92,74,58,0.08); }
  .header-title {
    flex: 1; text-align: center; font-size: 17px; font-weight: 700;
    color: #3A2E24; letter-spacing: 0.3px;
  }
  .btn-new {
    width: 40px; height: 40px; display: flex; align-items: center;
    justify-content: center; font-size: 24px; color: #5C4A3A;
    cursor: pointer; border-radius: 50%; transition: background 0.2s;
    font-weight: 300;
  }
  .btn-new:hover { background: rgba(92,74,58,0.08); }
  /* User card */
  .user-card {
    margin: 12px 12px 4px 12px;
    padding: 14px 16px;
    background: #FFFFFF;
    border-radius: 14px;
    display: flex; align-items: center; gap: 12px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 1px 3px rgba(92,74,58,0.06);
  }
  .user-card:hover { box-shadow: 0 3px 12px rgba(92,74,58,0.1); }
  .user-card.logged-out {
    background: linear-gradient(135deg, #FFFBF5, #F9F2E8);
    border: 1.5px dashed #D4C4B0;
  }
  .user-card.logged-in {
    background: #FFFFFF;
    border: 1.5px solid rgba(92,74,58,0.08);
  }
  .user-icon {
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .user-icon.lock { background: rgba(139,115,85,0.12); }
  .user-icon.avatar { background: linear-gradient(135deg, #5C4A3A, #8B7355); color: #fff; font-size: 22px; }
  .user-info { flex: 1; min-width: 0; }
  .user-name { font-size: 15px; font-weight: 600; color: #3A2E24; }
  .user-hint { font-size: 12px; color: #A09080; margin-top: 2px; }
  .user-arrow { color: #C4B8A8; font-size: 16px; }
  /* Divider */
  .section-divider {
    margin: 8px 16px; height: 0.5px; background: rgba(92,74,58,0.08);
  }
  /* Empty state */
  .empty-state {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 40px;
  }
  .empty-text { text-align: center; color: #B8A898; font-size: 13px; line-height: 1.8; }
  /* Conversation list */
  .conv-list {
    flex: 1; overflow-y: auto; padding: 4px 12px 16px;
  }
  .conv-item {
    display: flex; align-items: center; padding: 14px 16px;
    background: #FFFFFF; border-radius: 12px;
    margin-bottom: 6px;
    box-shadow: 0 1px 3px rgba(92,74,58,0.04);
    cursor: pointer;
    transition: all 0.15s;
  }
  .conv-item:hover { box-shadow: 0 2px 8px rgba(92,74,58,0.08); }
  .conv-content { flex: 1; min-width: 0; }
  .conv-title { font-size: 14px; font-weight: 600; color: #3A2E24;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-time { font-size: 11px; color: #B8A898; margin-top: 3px; }
  .btn-delete {
    width: 32px; height: 32px; display: flex; align-items: center;
    justify-content: center; color: #C4B8A8; border-radius: 50%;
    cursor: pointer; font-size: 16px; transition: all 0.2s;
    margin-left: 8px;
  }
  .btn-delete:hover { background: rgba(200,80,60,0.1); color: #C8503C; }
</style>
</head>
<body>

<!-- 未登录 -->
<div style="text-align:center">
  <div class="phone">
    <div class="header">
      <div class="btn-back">←</div>
      <div class="header-title">历史会话</div>
      <div class="btn-new">＋</div>
    </div>

    <!-- 用户状态卡片 - 未登录 -->
    <div class="user-card logged-out">
      <div class="user-icon lock">🔒</div>
      <div class="user-info">
        <div class="user-name">未登录</div>
        <div class="user-hint">登录后可同步会话记录</div>
      </div>
      <div class="user-arrow">›</div>
    </div>

    <div class="section-divider"></div>

    <div class="empty-state">
      <div class="empty-text">
        📋<br>暂无历史会话<br><br>
        <span style="font-size:12px">登录后开始对话即可自动保存</span>
      </div>
    </div>
  </div>
  <div class="label">未登录状态</div>
</div>

<!-- 已登录 -->
<div style="text-align:center">
  <div class="phone">
    <div class="header">
      <div class="btn-back">←</div>
      <div class="header-title">历史会话</div>
      <div class="btn-new">＋</div>
    </div>

    <!-- 用户状态卡片 - 已登录 -->
    <div class="user-card logged-in">
      <div class="user-icon avatar">🤖</div>
      <div class="user-info">
        <div class="user-name">Roxyer</div>
        <div class="user-hint">已登录 · 点击退出</div>
      </div>
      <div class="user-arrow">›</div>
    </div>

    <div class="section-divider"></div>

    <div class="conv-list">
      <div class="conv-item">
        <div class="conv-content">
          <div class="conv-title">推荐一款性价比高的蓝牙耳机</div>
          <div class="conv-time">2026-05-30 16:32</div>
        </div>
        <div class="btn-delete">🗑</div>
      </div>
      <div class="conv-item">
        <div class="conv-content">
          <div class="conv-title">油皮适合什么洗面奶？</div>
          <div class="conv-time">2026-05-29 14:10</div>
        </div>
        <div class="btn-delete">🗑</div>
      </div>
      <div class="conv-item">
        <div class="conv-content">
          <div class="conv-title">有没有便宜好用的面霜推荐</div>
          <div class="conv-time">2026-05-28 09:55</div>
        </div>
        <div class="btn-delete">🗑</div>
      </div>
    </div>
  </div>
  <div class="label">已登录状态</div>
</div>

</body>
</html>
