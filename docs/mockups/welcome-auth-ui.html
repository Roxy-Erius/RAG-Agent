<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欢迎页 — 登录/注册/游客入口</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1a1a1a;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 20px;
  }
  .phone {
    width: 375px; height: 700px;
    background: #F5F0EB;
    border-radius: 32px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex; flex-direction: column;
    position: relative;
  }
  /* Top decorative gradient */
  .top-glow {
    width: 100%; height: 180px;
    background: linear-gradient(180deg, rgba(139,115,85,0.15) 0%, rgba(245,240,235,0) 100%);
    position: absolute; top: 0; left: 0;
  }
  /* Content */
  .content {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; padding: 60px 32px 36px;
    position: relative; z-index: 1;
  }
  .logo {
    width: 80px; height: 80px; border-radius: 50%;
    background: linear-gradient(135deg, #5C4A3A, #8B7355);
    display: flex; align-items: center; justify-content: center;
    font-size: 38px; margin-bottom: 20px;
    box-shadow: 0 8px 24px rgba(92,74,58,0.25);
  }
  .app-name {
    font-size: 22px; font-weight: 700; color: #3A2E24;
    letter-spacing: 0.5px; margin-bottom: 8px;
  }
  .tagline {
    font-size: 13px; color: #A09080;
    margin-bottom: 48px; text-align: center;
    line-height: 1.6;
  }
  .tagline .highlight {
    color: #8B7355; font-weight: 600;
  }
  /* Buttons */
  .btn {
    width: 100%; height: 50px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 600; cursor: pointer;
    border: none; transition: all 0.2s; margin-bottom: 12px;
    letter-spacing: 0.5px;
  }
  .btn-primary {
    background: linear-gradient(135deg, #5C4A3A, #8B7355);
    color: #FFFFFF;
    box-shadow: 0 4px 14px rgba(92,74,58,0.3);
  }
  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(92,74,58,0.4);
  }
  .btn-outline {
    background: transparent;
    color: #5C4A3A;
    border: 1.5px solid #C4B0A0;
  }
  .btn-outline:hover {
    background: rgba(92,74,58,0.04);
  }
  /* Skip link */
  .skip-section { margin-top: auto; }
  .btn-skip {
    background: none; border: none; color: #B8A898;
    font-size: 13px; cursor: pointer; padding: 8px 20px;
    letter-spacing: 0.3px;
    transition: color 0.2s;
  }
  .btn-skip:hover { color: #8B7355; }
  .btn-skip::after {
    content: " →"; font-size: 11px; opacity: 0.6;
  }
  /* Feature highlights */
  .features {
    display: flex; gap: 20px; margin-bottom: 36px;
  }
  .feature {
    text-align: center; width: 70px;
  }
  .feature-icon {
    width: 48px; height: 48px; border-radius: 50%;
    background: rgba(139,115,85,0.08);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; margin: 0 auto 8px;
  }
  .feature-text {
    font-size: 10px; color: #A09080; line-height: 1.4;
  }
</style>
</head>
<body>

<div class="phone">
  <div class="top-glow"></div>
  <div class="content">
    <div class="logo">🤖</div>
    <div class="app-name">AI 导购助手</div>
    <div class="tagline">
      智能商品推荐 · 多轮对话<br>
      让 <span class="highlight">AI</span> 帮你发现好物
    </div>

    <!-- 三个功能亮点 -->
    <div class="features">
      <div class="feature">
        <div class="feature-icon">💬</div>
        <div class="feature-text">AI 对话<br>智能导购</div>
      </div>
      <div class="feature">
        <div class="feature-icon">🛒</div>
        <div class="feature-text">一键加购<br>方便快捷</div>
      </div>
      <div class="feature">
        <div class="feature-icon">📋</div>
        <div class="feature-text">会话记录<br>随时回顾</div>
      </div>
    </div>

    <!-- 主操作按钮 -->
    <button class="btn btn-primary">登 录</button>
    <button class="btn btn-outline">注 册</button>

    <div class="skip-section">
      <button class="btn-skip">暂不登录，以游客身份体验</button>
    </div>
  </div>
</div>

</body>
</html>
